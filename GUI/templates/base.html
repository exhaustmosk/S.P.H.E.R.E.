<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Mental health assessment{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-page="{% block page %}{% endblock %}">
  <header class="site-header">
    <a class="wordmark" href="{{ url_for('index') }}">Hack4Health <span>assessment</span></a>
    <div class="header-note">GUI preview — no models connected</div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    This interface is a layout preview, not a clinical diagnosis or medical device.
  </footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
