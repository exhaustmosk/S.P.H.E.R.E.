<p class="optional-banner">Optional — connect a wearable or enter if known.</p>
<div class="sensor-grid">
  {% for field in sensor_fields %}
    <div class="field">
      <label class="sensor-label" for="{{ field.name }}">
        {{ field.label }} <span class="unit">{{ field.unit }}</span>
      </label>
      <input
        id="{{ field.name }}"
        name="{{ field.name }}"
        type="number"
        inputmode="decimal"
        step="{{ field.step }}"
        min="{{ field.min }}"
        max="{{ field.max }}"
        placeholder="{{ field.placeholder }}"
      >
    </div>
  {% endfor %}
</div>
