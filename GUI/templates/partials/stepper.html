<div class="stepper">
  <div class="progress-segments" role="progressbar" aria-valuemin="1" aria-valuemax="4" aria-valuenow="{{ step }}" aria-label="Step {{ step }} of 4">
    {% for i in range(1, 5) %}
      <span class="progress-seg{% if i <= step %} is-filled{% endif %}"></span>
    {% endfor %}
  </div>
</div>
