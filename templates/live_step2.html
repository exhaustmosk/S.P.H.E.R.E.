{% extends "base.html" %}

{% block content %}
<div style="max-width: 720px; margin: 0 auto;">
  <form method="POST" action="{{ url_for('live_step2') }}" id="step2-form">
    <input type="hidden" name="audio_clip_uri" id="audio_clip_uri" value="">
    <input type="hidden" name="live_pitch_mean" id="live_pitch_mean" value="">
    <input type="hidden" name="live_speech_rate" id="live_speech_rate" value="">
    <input type="hidden" name="live_mfcc_mean" id="live_mfcc_mean" value="">
    <input type="hidden" name="live_mfcc_variance" id="live_mfcc_variance" value="">

    <!-- Prompt Box -->
    <div class="prompt-card">
      <div class="prompt-label">Reading Prompt (Speak clearly at normal cadence)</div>
      <div class="prompt-text">“The quick brown fox jumps over the lazy dog.”</div>
    </div>

    <!-- Audio Recorder Box -->
    <div class="audio-recorder-box">
      <div class="record-btn-pulse-wrapper">
        <button type="button" id="record-audio-btn" class="record-btn">
          <div class="pulse-ring"></div>
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
          </svg>
        </button>
      </div>

      <div id="recording-timer" class="recording-timer">00:00</div>
      <p id="record-btn-text" style="font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem;">
        Click microphone to record reading
      </p>

      <!-- Soundwave Visualizer Bars -->
      <div id="soundwave-visualizer" class="soundwave-visualizer">
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
        <div class="soundwave-bar"></div>
      </div>

      <!-- Playback Preview -->
      <div id="audio-preview-wrapper" style="display: none; margin-top: 1.25rem; width: 100%; max-width: 440px;">
        <div style="font-size: 0.8125rem; color: #059669; font-weight: 600; margin-bottom: 0.5rem;">
          ✓ Acoustic sample captured successfully
        </div>
        <audio id="audio-player" controls style="width: 100%; border-radius: var(--radius-md);"></audio>
      </div>

      <div style="margin-top: 1.5rem; display: flex; gap: 0.75rem;">
        <button type="button" id="rerecord-audio-btn" class="btn btn-secondary" style="display: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M1 4v6h6"></path>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          Re-record
        </button>
        <button type="button" id="simulate-audio-btn" class="btn btn-outline" style="font-size:0.8125rem;">
          Use simulated audio sample
        </button>
      </div>
    </div>

    <!-- Navigation Dock -->
    <div class="nav-actions-dock">
      <a href="{{ url_for('live_step1') }}" class="btn btn-secondary">
        ← Back to facial capture
      </a>
      <button type="submit" id="nav-next-btn" class="btn btn-primary btn-large" disabled>
        Continue to behavioral survey
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="5" y1="12" x2="19" y2="12"></line>
          <polyline points="12 5 19 12 12 19"></polyline>
        </svg>
      </button>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/audio.js') }}"></script>
{% endblock %}
